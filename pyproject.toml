[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "taskflow"
version = "0.1.0"
description = "A CLI tool for ticket/issue tracking with real-time collaboration"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "uvloop>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    "mypy>=1.5.0",
]

[project.scripts]
taskflow = "taskflow.cli.main:cli"

[tool.setuptools.packages.find]
include = ["taskflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
